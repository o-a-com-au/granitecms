name: Publish to npm

# Fires on a real version tag (v0.1.0, v1.2.3, ...) - never on an
# ordinary push to main, so a publish is always a deliberate, tagged
# release. No NPM_TOKEN or other long-lived secret is stored anywhere
# in this repo: id-token: write is what lets npm exchange this
# workflow's own GitHub-issued OIDC token for a short-lived publish
# credential (npm's "trusted publisher" flow). That trust relationship
# has to be registered once on npmjs.com against this exact repo and
# workflow filename before the first tag push - see docs/hosting.md's
# publish-readiness notes.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url IS required for trusted publishing (confirmed
      # against npm's own current docs, contrary to what an earlier
      # version of this comment guessed) - it's what tells npm which
      # registry to attempt the OIDC exchange against at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm CLI >=11.5.1 - don't rely on
      # whatever setup-node's chosen Node version happens to bundle.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # No NODE_AUTH_TOKEN/NPM_TOKEN anywhere - the trusted-publisher
      # OIDC exchange handles authentication on its own. Deliberately
      # plain `npm publish`, not `--provenance`: with trusted
      # publishing, npm generates and attaches provenance automatically
      # (per npm's own docs) - passing --provenance explicitly forces a
      # different, older code path whose separate registry-auth step
      # doesn't correctly pick up the trusted-publisher exchange,
      # producing a confusing 404 on the actual registry write even
      # though provenance itself signs and logs successfully. Found
      # this the hard way on the first real release attempts.
      - run: npm publish

name: Publish to npm

# Fires on a real version tag (v0.1.0, v1.2.3, ...) - never on an
# ordinary push to main, so a publish is always a deliberate, tagged
# release. No NPM_TOKEN or other long-lived secret is stored anywhere
# in this repo: id-token: write is what lets npm exchange this
# workflow's own GitHub-issued OIDC token for a short-lived publish
# credential (npm's "trusted publisher" flow). That trust relationship
# has to be registered once on npmjs.com against this exact repo and
# workflow filename before the first tag push - see docs/hosting.md's
# publish-readiness notes.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url here: setup-node's registry-url
      # option writes an .npmrc referencing ${NODE_AUTH_TOKEN} and sets
      # that env var for later steps, even with no real token secret
      # configured anywhere - npm then tries that (empty) token-based
      # auth instead of the OIDC trusted-publisher exchange, and the
      # registry rejects it with a 404 ("not found or no permission"),
      # not an auth error, which is genuinely confusing to debug the
      # first time. Found this the hard way on the first real release.
      # npm's own default registry is already registry.npmjs.org - no
      # config needed for that part.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs a recent npm CLI - don't rely on
      # whatever setup-node's chosen Node version happens to bundle.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # No --//registry.npmjs.org/:_authToken and no NODE_AUTH_TOKEN -
      # the trusted-publisher OIDC exchange handles authentication.
      # --provenance attaches a public attestation linking this exact
      # tarball back to this workflow run and commit.
      - run: npm publish --provenance
